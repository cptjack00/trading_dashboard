[project]
name = "signal-deck"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Le Anh Quang", email = "quangnb2000@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
signal-deck = "signal_deck:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
